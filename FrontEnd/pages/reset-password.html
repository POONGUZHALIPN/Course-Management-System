<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-shield-check"></i></div>
      <h3 class="fw-bold mb-1">Reset Password</h3>
      <p class="text-muted">Create a new password for your account</p>
    </div>

    <form action="login.html">

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" placeholder="Enter new password" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" placeholder="Confirm new password" required>
      </div>

      <button type="submit" class="btn btn-gradient-primary w-100 py-2">
        Reset Password <i class="bi bi-check2-circle ms-1"></i>
      </button>

    </form>
  </div>
</div>

</body>
</html>
