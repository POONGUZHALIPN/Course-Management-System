<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-key-fill"></i></div>
      <h3 class="fw-bold mb-1">Forgot Password?</h3>
      <p class="text-muted">Enter your registered email and we'll help you reset it</p>
    </div>

    <form action="reset-password.html">

      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" class="form-control border-start-0" placeholder="Enter your registered email" required>
        </div>
      </div>

      <button type="submit" class="btn btn-gradient-primary w-100 py-2 mb-3">
        Send Reset Link <i class="bi bi-send ms-1"></i>
      </button>

      <p class="text-center text-muted mb-0">
        Remembered your password? <a href="login.html" class="fw-semibold" style="color:var(--primary)">Back to Login</a>
      </p>

    </form>
  </div>
</div>

</body>
</html>
