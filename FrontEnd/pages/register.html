<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="auth-wrapper py-5">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card" style="max-width:560px;">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-person-plus-fill"></i></div>
      <h3 class="fw-bold mb-1">Create your account</h3>
      <p class="text-muted">Join LearnSphere and start tracking your progress</p>
    </div>

    <form action="login.html">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Degree Program</label>
          <select class="form-select" required>
            <option value="">Select Degree</option>
            <option>B.Tech / B.E</option>
            <option>B.Sc</option>
            <option>B.C.A</option>
            <option>M.Tech / M.E</option>
            <option>M.Sc</option>
            <option>M.C.A</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Year of Study</label>
          <select class="form-select" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
            <option>Graduated</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Course to Enroll</label>
        <select class="form-select" required>
          <option value="">Choose Course</option>
          <option>Full Stack Development</option>
          <option>Data Science</option>
          <option>UI / UX Design</option>
          <option>Cyber Security</option>
          <option>Cloud Computing</option>
          <option>Artificial Intelligence</option>
        </select>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Create password" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" placeholder="Confirm password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-gradient-accent w-100 py-2 mb-3">
        Create Account <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <p class="text-center text-muted mb-0">
        Already have an account? <a href="login.html" class="fw-semibold" style="color:var(--primary)">Login</a>
      </p>

      <p class="text-center mt-3 mb-0">
        <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </p>

    </form>
  </div>
</div>

</body>
</html>
