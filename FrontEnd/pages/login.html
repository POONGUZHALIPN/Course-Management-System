<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <h3 class="fw-bold mb-1">Welcome back, Learner</h3>
      <p class="text-muted">Login to continue your learning journey</p>
    </div>

    <form action="student-dashboard.html">

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" class="form-control border-start-0" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control border-start-0" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label small" for="remember">Remember me</label>
        </div>
        <a href="forgot-password.html" class="small fw-semibold" style="color:var(--primary)">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-gradient-primary w-100 py-2 mb-3">
        Login <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <p class="text-center text-muted mb-2">
        Don't have an account? <a href="register.html" class="fw-semibold" style="color:var(--primary)">Register</a>
      </p>

      <p class="text-center mb-0">
        <a href="admin-login.html" class="small text-muted"><i class="bi bi-shield-lock me-1"></i>Login as Admin instead</a>
      </p>

    </form>

    <p class="text-center mt-4 mb-0">
      <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
    </p>
  </div>
</div>

</body>
</html>
