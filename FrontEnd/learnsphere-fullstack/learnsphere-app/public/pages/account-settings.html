<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-person-gear"></i></div>
      <h3 class="fw-bold mb-1">Account Settings</h3>
      <p class="text-muted mb-0">Signed in as <b id="currentUserName">…</b></p>
    </div>

    <div class="alert-inline" id="changeAlert"></div>

    <form id="changePasswordForm" novalidate>

      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" id="currentPassword" class="form-control" placeholder="Enter your current password" required>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password" required minlength="6">
      </div>

      <button type="submit" id="changeSubmit" class="btn btn-gradient-primary w-100 py-2">
        Update Password <i class="bi bi-check2-circle ms-1"></i>
      </button>

    </form>

    <p class="text-center mt-4 mb-0">
      <a href="#" id="backToDashboard" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/account-settings.js"></script>
</body>
</html>
