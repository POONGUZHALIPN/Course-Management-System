<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">

<style>
.auth-wrapper.admin-bg{
    background:linear-gradient(120deg,#0b1220,#111827 60%,#1e293b);
}
</style>
</head>
<body>

<div class="auth-wrapper admin-bg">
  <div class="hero-orb orb-1" style="background:#334155;"></div>
  <div class="hero-orb orb-2" style="background:#4f46e5;"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon admin"><i class="bi bi-shield-lock-fill"></i></div>
      <span class="badge-soft badge-soft-primary mb-2">ADMIN ACCESS</span>
      <h3 class="fw-bold mb-1">Admin Portal</h3>
      <p class="text-muted">Sign in to manage students and courses</p>
    </div>

    <div class="alert-inline" id="adminLoginAlert"></div>

    <form id="adminLoginForm" novalidate>

      <div class="mb-3">
        <label class="form-label">Admin Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" id="adminEmail" class="form-control border-start-0" placeholder="admin@learnsphere.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" id="adminPassword" class="form-control border-start-0" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" id="adminLoginSubmit" class="btn w-100 py-2 mb-3 text-white fw-semibold" style="background:linear-gradient(135deg,#0f172a,#334155); border-radius:12px;">
        Login as Admin <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <p class="text-center text-muted mb-0">
        Not an admin? <a href="login.html" class="fw-semibold" style="color:var(--primary)">Student Login</a>
      </p>

      <p class="text-center mt-3 mb-0">
        New admin? <a href="admin-register.html" class="fw-semibold" style="color:var(--primary)">Register here</a>
      </p>

      <p class="text-center mt-4 mb-0">
        <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </p>

    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Demo login: <b>admin@learnsphere.com</b> / <b>admin123</b></small>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-login.js"></script>
</body>
</html>
