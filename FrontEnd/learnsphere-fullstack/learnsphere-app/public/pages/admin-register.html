<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Registration — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">

<style>
.auth-wrapper.admin-bg{
    background:linear-gradient(120deg,#0b1220,#111827 60%,#1e293b);
}
</style>
</head>
<body>

<div class="auth-wrapper admin-bg">
  <div class="hero-orb orb-1" style="background:#334155;"></div>
  <div class="hero-orb orb-2" style="background:#4f46e5;"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon admin"><i class="bi bi-person-fill-add"></i></div>
      <span class="badge-soft badge-soft-primary mb-2">ADMIN ACCESS</span>
      <h3 class="fw-bold mb-1">Register as Admin</h3>
      <p class="text-muted">Create an admin account to monitor student progress</p>
    </div>

    <div class="alert-inline" id="adminRegisterAlert"></div>

    <form id="adminRegisterForm" novalidate>

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Admin Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@learnsphere.com" required>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required minlength="6">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Admin Invite Code</label>
        <input type="text" id="inviteCode" class="form-control" placeholder="Enter the invite code" required>
        <small class="text-muted">Ask your institution's super admin for this code.</small>
      </div>

      <button type="submit" id="adminRegisterSubmit" class="btn w-100 py-2 mb-3 text-white fw-semibold" style="background:linear-gradient(135deg,#0f172a,#334155); border-radius:12px;">
        Create Admin Account <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <p class="text-center text-muted mb-0">
        Already an admin? <a href="admin-login.html" class="fw-semibold" style="color:var(--primary)">Login</a>
      </p>

      <p class="text-center mt-3 mb-0">
        <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </p>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Demo invite code: <b>LEARNSPHERE2026</b></small>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-register.js"></script>
</body>
</html>
