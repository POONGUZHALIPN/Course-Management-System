<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — LearnSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">

<style>
.code-display{
    text-align:center;
    letter-spacing:8px;
    font-size:28px;
    font-weight:800;
    color:var(--primary);
    background:var(--surface-alt);
    border-radius:12px;
    padding:14px;
    margin-bottom:18px;
    font-family:'Poppins', monospace;
}
.step-dot{
    width:8px;height:8px;border-radius:50%;
    background:#e2e8f0;
    display:inline-block;
}
.step-dot.active{ background:var(--primary); }
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon"><i class="bi bi-key-fill"></i></div>
      <h3 class="fw-bold mb-1">Forgot Password?</h3>
      <p class="text-muted mb-2" id="stepDescription">Enter your registered email and we'll send you a reset code</p>
      <div>
        <span class="step-dot active" id="dot1"></span>
        <span class="step-dot" id="dot2"></span>
      </div>
    </div>

    <div class="alert-inline" id="forgotAlert"></div>

    <!-- STEP 1: request a code -->
    <form id="requestCodeForm" novalidate>
      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" id="email" class="form-control border-start-0" placeholder="Enter your registered email" required>
        </div>
      </div>

      <button type="submit" id="requestCodeSubmit" class="btn btn-gradient-primary w-100 py-2 mb-3">
        Send Reset Code <i class="bi bi-send ms-1"></i>
      </button>

      <p class="text-center text-muted mb-0">
        Remembered your password? <a href="login.html" class="fw-semibold" style="color:var(--primary)">Back to Login</a>
      </p>
    </form>

    <!-- STEP 2: enter code + new password -->
    <form id="resetForm" class="d-none" novalidate>

      <div class="code-display" id="demoCodeDisplay" style="display:none;"></div>
      <p class="text-center text-muted small mb-3" id="demoCodeCaption" style="display:none;">
        No email server is configured in this demo — your code is shown above.
        In production this would be emailed instead.
      </p>

      <div class="mb-3">
        <label class="form-label">6-Digit Reset Code</label>
        <input type="text" id="code" class="form-control text-center" style="letter-spacing:6px; font-weight:700;" maxlength="6" placeholder="••••••" required>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password" required minlength="6">
      </div>

      <button type="submit" id="resetSubmit" class="btn btn-gradient-primary w-100 py-2 mb-2">
        Reset Password <i class="bi bi-check2-circle ms-1"></i>
      </button>

      <button type="button" id="resendCodeBtn" class="btn btn-outline-brand w-100 py-2 mb-3">
        Resend Code
      </button>

      <p class="text-center mb-0">
        <a href="#" id="backToStep1" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Use a different email</a>
      </p>
    </form>

  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/forgot-password.js"></script>
</body>
</html>
